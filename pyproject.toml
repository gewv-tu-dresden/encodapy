[tool.poetry]
name = "encodapy"
version = "0.9.3"
description = "EnCoDaPy - Energy Control and Data Preparation in Python."
readme = "./docs/readme-pypi.md"
repository = "https://github.com/gewv-tu-dresden/encodapy"
documentation = "https://gewv-tu-dresden.github.io/encodapy/"
license = "BSD-3-Clause"
authors = [
    "Martin Altenburger <martin.altenburger@tu-dresden.de>",
    "Paul Seidel <paul.seidel@tu-dresden.de>",
    "Maximilian Beyer <maximilian.beyer@tu-dresden.de>",
]
packages = [{ include = "encodapy" }]
include = ["encodapy/py.typed"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.3.3,<2.4.0"
nbformat = ">=5.11.1"
filip = ">=0.7.5"
numpy = ">=2.4.6"
loguru = ">=0.7.3"
requests = ">=2.32.5"
requests-oauthlib = ">=2.0.0"
crate = ">=2.2.1"
pydantic = ">=2.8.2,<2.9.0"
python-dotenv = ">=1.2.3"
pydantic-settings = "^2.2.1"
types-requests = "^2.33.0"
pint = "^0.25.3"

[tool.poetry.group.dev.dependencies]
pylint = ">=4.0.8"
build = ">=1.6.0"
ipykernel = ">=7.3.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
sphinx = "^8.2.3"
autodoc-pydantic = "^2.2.0"
sphinx-rtd-theme = "^3.1.0"
sphinx-autodoc-typehints = "^3.5.2"
myst-parser = "^5.1.0"
flixopt = "^8.1.0"
rdflib = "^7.6.0"
types-python-dateutil = "^2.9.0.20260807"
types-oauthlib = "^3.3.0.20260724"
types-requests-oauthlib = "^2.0.0.20260518"
pandas-stubs = "^3.0"
pylint-pydantic = "^0.4.1"
cffconvert = "^2.0.0"
pre-commit = "^4.6.2"
ruff = "^0.16.6"
pytest-asyncio = "^1.4.0"
testcontainers = "^4.15.0"
pytest-order = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "filip.*"  # Ignore missing imports for the filip package
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests with optional external runtime dependencies",
    "docker: tests requiring Docker containers via testcontainers",
    "slow: tests that take a long time to run",
]
