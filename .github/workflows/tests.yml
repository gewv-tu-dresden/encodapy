name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1.4.1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: pydeps-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest --cov=encodapy --cov-report=term-missing

  docs-build-test:
    runs-on: ubuntu-latest
    env:
      DOCS_GITHUB_VERSION: ${{ github.head_ref }}
      DOCS_BASE_URL: /encodapy/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install

      # -W behandelt Sphinx-Warnungen als Fehler (optional, aber empfehlenswert)
      - name: Build documentation
        run: poetry run sphinx-build -b html -a -E -W ./docs/source ./docs/build

  # Integration tests with Docker containers
  # These tests require Docker and testcontainers
  # Note: Docker-in-Docker (DinD) is used for running containers in CI
  integration-tests:
    name: Integration Tests (FIWARE + Docker)
    runs-on: ubuntu-latest
    # Only run on pull requests and main branch pushes
    # Disabled by default - enable by removing the if condition or setting to true
    if: false  # Set to true or remove to enable integration tests in CI
    
    services:
      # Use Docker-in-Docker service
      docker:
        image: docker:dind
        options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: pydeps-integration-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root
          # Install testcontainers for integration tests
          poetry add --group dev testcontainers
          poetry install --no-interaction

      - name: Run integration tests
        run: |
          poetry run pytest \
            tests/core/communication/fiware/test_fiware_connection_integration.py \
            -v \
            -m integration \
            --cov=encodapy/service/communication/fiware_connection \
            --cov-report=term-missing
        timeout-minutes: 15
        env:
          DOCKER_HOST: tcp://docker:2375
          DOCKER_TLS_VERIFY: "0"
          DOCKER_CLI_EXPERIMENTAL: enabled
        
      - name: Clean up Docker containers
        if: always()
        run: docker system prune -f
