name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: .venv
          key: pydeps-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -m "not integration and not docker" --cov=encodapy --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unit-tests
          name: unit-tests-coverage
          fail_ci_if_error: false

  docs-build-test:
    runs-on: ubuntu-latest
    env:
      DOCS_GITHUB_VERSION: ${{ github.head_ref }}
      DOCS_BASE_URL: /encodapy/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install

      # -W treats warnings as errors, -E ignores cached files, -a rebuilds all files
      - name: Build documentation
        run: poetry run sphinx-build -b html -a -E -W ./docs/source ./docs/build

  # Integration tests with Docker containers
  # These tests require Docker and testcontainers

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    
    services:
      # Use Docker-in-Docker service
      docker:
        image: docker:dind
        options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: pydeps-integration-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev

      - name: Run integration tests
        run: |
          poetry run pytest \
            -m "integration or docker" \
            -v \
            --cov=encodapy \
            --cov-report=xml \
            --cov-report=term-missing
        timeout-minutes: 15
        env:
          DOCKER_HOST: tcp://docker:2375
          DOCKER_TLS_VERIFY: "0"
          DOCKER_CLI_EXPERIMENTAL: enabled
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: integration-tests
          name: integration-tests-coverage
          fail_ci_if_error: false
      
      - name: Clean up Docker containers
        if: always()
        run: docker system prune -f
