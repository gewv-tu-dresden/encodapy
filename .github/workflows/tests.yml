# Author: Martin Altenburger
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Windows only runs as a canary with the newest Python version,
        # the full Python matrix runs on Ubuntu
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    # Required for snok/install-poetry on Windows runners:
    # poetry is only added to PATH for bash, not for PowerShell
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        # .venv caching on Windows runners is unreliable and can stall
        # (see snok/install-poetry README), so we only cache on Linux
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .venv
          key: pydeps-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Cache Poetry downloads (Windows)
        id: cache-pip
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          # Poetry downloads wheels/artifacts to its own cache dir on Windows
          path: ~\AppData\Local\pypoetry\Cache
          key: poetrycache-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -m "not integration and not docker" --cov=encodapy --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
        with:
          files: ./coverage.xml
          flags: unit-tests-${{ runner.os }}
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
          token: ${{ secrets.CODECOV_TOKEN }}

  docs-build-test:
    runs-on: ubuntu-24.04
    env:
      DOCS_GITHUB_VERSION: ${{ github.head_ref }}
      DOCS_BASE_URL: /encodapy/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install

      # -W treats warnings as errors, -E ignores cached files, -a rebuilds all files
      - name: Build documentation
        run: poetry run sphinx-build -b html -a -E -W ./docs/source ./docs/build

  # Integration tests with Docker containers
  # These tests require Docker and testcontainers

  integration-tests:
    name: integration tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: .venv
          key: pydeps-integration-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev

      - name: Run integration tests
        run: |
          poetry run pytest \
            -m "integration or docker" \
            -v \
            --cov=encodapy \
            --cov-report=xml \
            --cov-report=term-missing
        timeout-minutes: 15

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
        with:
          files: ./coverage.xml
          flags: integration-tests
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Clean up Docker containers
        if: always()
        run: docker system prune -f

  # Gate job with a stable name: make this one the required status check
  # in branch protection, so matrix/job changes never break the protection
  ci:
    name: All tests passed
    needs: [unit-tests, docs-build-test, integration-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any dependency failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
