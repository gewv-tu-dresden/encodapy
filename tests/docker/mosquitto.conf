# Mosquitto configuration for EnCoDaPy integration tests
# Minimal configuration for testing purposes

# Listen on all interfaces
listener 1883

# Allow anonymous connections (for testing)
allow_anonymous true

# Logging configuration
log_dest stdout
log_type all
log_timestamp true

# Persistence (disabled for tests)
persistence false

# Security (relaxed for testing)
allow_zero_length_clientid true

# Keepalive settings
max_keepalive 60

# Protocol (MQTT v3.1.1)
protocol mqtt
